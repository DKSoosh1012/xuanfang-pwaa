<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02040d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 選房">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>AI 能量選號器 Pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #02040d;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      color: white;
    }

    /* 開局動畫 */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
      animation: hideLoading 3s forwards;
      animation-delay: 2.5s;
      pointer-events: none; 
    }

    .boot-text {
      color: #00ffee;
      font-size: 40px;
      letter-spacing: 5px;
      animation: flicker 1s infinite;
    }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 4px;
      background: #00ffee;
      box-shadow: 0 0 20px #00ffee;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 100%; }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes hideLoading {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* 主畫面 */
    .container {
      padding: 30px;
      min-height: 100vh;
    }

    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
      gap: 20px;
    }

    /* 左側群組 */
    .left-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
      width: 320px;
    }

    #serverStatus {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00ffee;
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00ffee;
      box-shadow: 0 0 15px #00ffee;
      animation: serverPulse 2s infinite;
      width: 100%;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 15px #00ff88;
      animation: blink 1s infinite;
    }

    .hud-box {
      border: 2px solid #8a2eff;
      padding: 12px 25px;
      border-radius: 12px;
      color: #b86cff;
      box-shadow: 0 0 15px #8a2eff;
      letter-spacing: 2px;
      font-weight: bold;
      width: 100%;
    }

    /* AI 即時數據統計面板 */
    .stat-panel {
      background: rgba(7, 16, 29, 0.7);
      border: 1px solid rgba(138, 46, 255, 0.4);
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      font-size: 14px;
      line-height: 1.8;
    }

    .stat-title {
      color: #8a2eff;
      font-weight: bold;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(138, 46, 255, 0.2);
      padding-bottom: 5px;
      letter-spacing: 1px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      color: #aaa;
    }

    .stat-value {
      color: #ffe600;
      font-weight: bold;
    }

    .stat-value.cyan { color: #00ffee; }
    .stat-value.green { color: #00ff88; }

    /* 右側控制組合 */
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      display: flex;
      gap: 6px;
    }

    .search-input {
      background: rgba(2, 4, 13, 0.8);
      border: 1px solid #8a2eff;
      border-radius: 10px;
      padding: 10px;
      color: #00ffee;
      outline: none;
      width: 140px; 
      text-align: center;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(138, 46, 255, 0.1);
    }

    .search-btn {
      background: rgba(138, 46, 255, 0.2);
      border: 1px solid #8a2eff;
      color: #b86cff;
      padding: 0 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .search-btn:hover {
      background: #8a2eff;
      color: white;
      box-shadow: 0 0 15px #8a2eff;
    }

    .mode-selector {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      background: rgba(7, 16, 29, 0.6);
      border: 1px solid #00ffee;
      color: #00ffee;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 238, 0.1);
      transition: all 0.3s ease;
    }

    .mode-btn:hover {
      background: rgba(0, 255, 238, 0.1);
      box-shadow: 0 0 15px rgba(0, 255, 238, 0.4);
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: #00ffee;
      color: #02040d;
      font-weight: bold;
      box-shadow: 0 0 20px #00ffee;
    }

    .generate-btn {
      background: #8a2eff;
      border: none;
      color: white;
      padding: 14px 30px;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 20px #8a2eff;
      transition: 0.3s;
      width: 100%;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .generate-btn:hover {
      transform: scale(1.02);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    /* 標準卡片樣式 */
    .card {
      animation: rgbBorder 6s linear infinite;
      position: relative;
      background: #07101d;
      border: 2px solid rgba(138, 46, 255, 0.5);
      border-radius: 20px;
      padding: 25px;
      cursor: pointer;
      overflow: hidden;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(138, 46, 255, 0.3);
    }

    /* ⚡ SS級黃金閃爍卡片特有樣式 */
    .card.ss-rank {
      animation: goldGlow 2s ease-in-out infinite alternate !important;
      background: #0e1616;
    }

    .card.ss-rank .percent {
      color: #ff3b3b !important;
      text-shadow: 0 0 10px #ff3b3b;
    }

    @keyframes goldGlow {
      0% { border-color: #ffe600; box-shadow: 0 0 15px rgba(255, 230, 0, 0.4); }
      100% { border-color: #ff3b3b; box-shadow: 0 0 35px rgba(255, 59, 59, 0.8); transform: scale(1.02); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transform: translateX(-100%);
      transition: 0.5s;
    }

    .card:hover::before {
      transform: translateX(100%);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 30px rgba(138, 46, 255, 0.9);
    }

    .room {
      font-size: 28px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .percent {
      font-size: 30px;
      color: #ffe600;
      font-weight: bold;
    }

    .label {
      color: #7ddcff;
      margin-bottom: 8px;
    }

    /* 彈窗樣式 */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .popup-box {
      animation: popupRGB 5s linear infinite;
      position: relative;
      width: 500px;
      background: #07101d;
      border-radius: 20px;
      border: 2px solid #ff00ff;
      padding: 40px;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 0 40px #ff00ff;
    }

    .glow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 0, 255, 0.2), transparent);
    }

    .popup-box h2 {
      position: relative;
      font-size: 45px;
      margin-bottom: 10px;
    }

    /* 新增彈窗專屬 % 數值外觀效果 */
    .popup-percent {
      position: relative;
      font-size: 32px;
      color: #ffe600;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.6);
      letter-spacing: 1px;
    }

    .rank {
      position: relative;
      font-size: 46px;
      color: #00ff88;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .recommend {
      position: relative;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .verify {
      position: relative;
      color: #6dff93;
      margin-bottom: 20px;
    }

    .confidence {
      position: relative;
      margin-bottom: 10px;
    }

    .bar {
      position: relative;
      width: 100%;
      height: 20px;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ff88, #00ffee);
      transition: 1s;
    }

    .popup-close-btn {
      position: relative;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: #65ff98;
      color: black;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .popup-close-btn:hover {
      background: #4ae07d;
      transform: scale(1.02);
    }

    /* 動畫特效 */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes serverPulse {
      0% { box-shadow: 0 0 10px #00ffee; }
      50% { box-shadow: 0 0 25px #00ffee; }
      100% { box-shadow: 0 0 10px #00ffee; }
    }

    @keyframes rgbBorder {
      0% { border-color: #ff00ff; }
      25% { border-color: #00ffee; }
      50% { border-color: #00ff88; }
      75% { border-color: #ffe600; }
      100% { border-color: #ff00ff; }
    }

    @keyframes popupRGB {
      0% { border-color: #ff00ff; box-shadow: 0 0 30px #ff00ff; }
      25% { border-color: #00ffee; box-shadow: 0 0 30px #00ffee; }
      50% { border-color: #00ff88; box-shadow: 0 0 30px #00ff88; }
      75% { border-color: #ffe600; box-shadow: 0 0 30px #ffe600; }
      100% { border-color: #ff00ff; box-shadow: 0 0 30px #ff00ff; }
    }

    /* 手機版優化 */
    @media(max-width:900px){
      .top-hud {
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
      }

      .left-group {
        width: 100%;
        align-items: center;
      }

      .control-group {
        align-items: stretch;
        width: 100%;
      }

      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }

      .search-input {
        flex: 1;
      }

      .mode-selector {
        justify-content: space-between;
      }

      .mode-btn {
        flex: 1;
        padding: 10px 5px;
        font-size: 13px;
        text-align: center;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .popup-box {
        width: 95%;
        padding: 25px 20px;
      }
    }
    @media (max-width: 600px) {
      body { padding-bottom: env(safe-area-inset-bottom); }
      .container { padding: calc(16px + env(safe-area-inset-top)) 14px 24px; }
      .top-hud { gap: 12px; margin-bottom: 18px; }
      .left-group { width: 100%; gap: 10px; }
      #serverStatus { position: static; width: 100%; padding: 9px 12px; font-size: 11px; box-shadow: 0 0 10px #00ffee; }
      .hud-box { padding: 10px 12px; font-size: 13px; letter-spacing: 1px; }
      .stat-panel { padding: 10px 12px; font-size: 12px; }
      .control-group { align-items: stretch; gap: 10px; }
      .action-bar { flex-wrap: wrap; gap: 8px; }
      .mode-selector { gap: 7px; }
      .mode-btn { min-height: 44px; padding: 10px 4px; font-size: 13px; }
      .search-box { flex: 1 1 100%; }
      .search-box input { min-width: 0; flex: 1; }
      .generate-btn { flex: 1 1 100%; min-height: 48px; padding: 12px 16px; font-size: 16px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .card { border-radius: 14px; padding: 16px 12px; }
      .room { font-size: clamp(18px, 5vw, 23px); margin-bottom: 10px; }
      .percent { font-size: 25px; }
      .label { font-size: 13px; margin-bottom: 5px; }
      .popup { padding: 12px; }
      .popup-box { width: 100%; max-width: 420px; max-height: calc(100dvh - 24px); overflow-y: auto; padding: 28px 18px; }
      .popup-box h2 { font-size: clamp(30px, 9vw, 40px); }
      .rank { font-size: 38px; }
      .recommend { font-size: 16px; }
      .popup-close-btn { min-height: 48px; }
      .boot-text { font-size: clamp(24px, 8vw, 36px); letter-spacing: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>

  <div id="loadingScreen">
    <div class="scan-line"></div>
    <h1 class="boot-text">AI SYSTEM LOADING...</h1>
  </div>

  <div class="container">

    <div class="top-hud">
      <div class="left-group">
        <div id="serverStatus">
          <div class="dot"></div>
          CONNECTING AI SERVER...
        </div>
        <div class="hud-box">Wei</div>
        
        <div class="stat-panel">
          <div class="stat-title">📊 SYSTEM CORES DATA</div>
          <div class="stat-item">當前在線人數：<span class="stat-value green" id="onlineCount">0 人</span></div>
          <div class="stat-item">AI 殘餘算力：<span class="stat-value cyan" id="aiPower">98.4%</span></div>
          <div class="stat-item">每小時強勢房號：<span class="stat-value" id="strongestRoom">計算中...</span></div>
        </div>
      </div>

      <div class="control-group">
        <div class="action-bar">
          <div class="search-box">
            <input type="text" class="search-input" id="searchRoomId" placeholder="輸入房號或區間">
            <button class="search-btn" onclick="searchCustomRoom()">分析房號</button>
          </div>

          <div class="mode-selector">
            <button class="mode-btn active" id="btn-set1" onclick="changeMode('set1')">虎小妹</button>
            <button class="mode-btn" id="btn-set2" onclick="changeMode('set2')">賽特2</button>
            <button class="mode-btn" id="btn-baphomet" onclick="changeMode('baphomet')">巴風特</button>
          </div>
        </div>

        <button class="generate-btn" onclick="generateRooms()">
          一鍵生成房號
        </button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

  </div>

  <div class="popup" id="popup">
    <div class="popup-box">
      <div class="glow-bg"></div>
      <h2 id="roomTitle">第 000 房</h2>
      <div class="popup-percent" id="popupPercentText">AI 爆分率：--%</div>
      <div class="rank" id="rankText">能量等級 S</div>
      <div class="recommend" id="recommend">AI 判定強勢｜推薦主攻</div>
      <div class="verify">✓ AI 確認章</div>
      <div class="confidence">信心指數</div>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
      <button class="popup-close-btn" onclick="closePopup()">關閉</button>
    </div>
  </div>

  <script>
    const grid = document.getElementById("grid");
    const popup = document.getElementById("popup");
    const roomTitle = document.getElementById("roomTitle");
    const rankText = document.getElementById("rankText");
    const recommend = document.getElementById("recommend");
    const fill = document.getElementById("fill");
    const popupPercentText = document.getElementById("popupPercentText");

    let minRoom = 1;
    let maxRoom = 3000;
    let currentModeName = "set1";

    const modes = {
      set1: { min: 1, max: 3000 },
      set2: { min: 1, max: 4000 },
      baphomet: { min: 1, max: 1000 }
    };

    const hourlyHistory = {
      lastHour: -1,
      set1: 0,
      set2: 0,
      baphomet: 0
    };

    function random(min, max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateHourlyStrongestRoom() {
      const now = new Date();
      const currentHour = now.getHours();

      if (currentHour !== hourlyHistory.lastHour) {
        hourlyHistory.lastHour = currentHour;
        hourlyHistory.set1 = random(modes.set1.min, modes.set1.max);
        hourlyHistory.set2 = random(modes.set2.min, modes.set2.max);
        hourlyHistory.baphomet = random(modes.baphomet.min, modes.baphomet.max);
      }

      const strongestId = hourlyHistory[currentModeName];
      document.getElementById("strongestRoom").innerText = `第 ${strongestId} 房`;
    }

    function changeMode(modeName) {
      if (!modes[modeName]) return;

      currentModeName = modeName;
      minRoom = modes[modeName].min;
      maxRoom = modes[modeName].max;

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      if (modeName === 'set1') document.getElementById('btn-set1').classList.add('active');
      if (modeName === 'set2') document.getElementById('btn-set2').classList.add('active');
      if (modeName === 'baphomet') document.getElementById('btn-baphomet').classList.add('active');

      updateHourlyStrongestRoom();
      generateRooms();
    }

    function weightedPercent(){
      let rand = Math.random();
      if(rand < 0.05) return random(110,120);
      if(rand < 0.20) return random(95,109);
      if(rand < 0.45) return random(80,94);
      if(rand < 0.75) return random(70,79);
      return random(60,69);
    }

    function generateRooms(){
      grid.innerHTML = "";
      const generatedRooms = new Set();

      for(let i=0; i<20; i++){
        let room = random(minRoom, maxRoom);
        
        let attempts = 0;
        while(generatedRooms.has(room) && attempts < 100) {
          room = random(minRoom, maxRoom);
          attempts++;
        }
        generatedRooms.add(room);

        let percent = weightedPercent();
        
        const card = document.createElement("div");
        card.className = "card";
        
        if (percent >= 100) {
          card.classList.add("ss-rank");
        }

        card.innerHTML = `
          <div class="room" id="room-text-${i}">[DECODING]</div>
          <div class="label">爆分率</div>
          <div class="percent" id="percent-text-${i}">--%</div>
        `;

        card.onclick = () => {
          openPopup(room, percent);
        };

        grid.appendChild(card);

        let counter = 0;
        const interval = setInterval(() => {
          document.getElementById(`room-text-${i}`).innerText = `第 ${random(minRoom, maxRoom)} 房`;
          document.getElementById(`percent-text-${i}`).innerText = `${random(60, 120)}%`;
          counter++;
          
          if(counter > 10) {
            clearInterval(interval);
            document.getElementById(`room-text-${i}`).innerText = `第 ${room} 房`;
            document.getElementById(`percent-text-${i}`).innerText = `${percent}%`;
          }
        }, 50);
      }
    }

    function searchCustomRoom() {
      const inputEl = document.getElementById("searchRoomId");
      let rawValue = inputEl.value.trim();
      let targetRoomId = 0;

      if (rawValue.includes('~') || rawValue.includes('～')) {
        let parts = rawValue.split(/[~～]/);
        let startNum = parseInt(parts[0].replace(/\D/g, ''));
        let endNum = parseInt(parts[1].replace(/\D/g, ''));

        if (isNaN(startNum) || isNaN(endNum)) {
          alert(`請輸入正確的範圍格式，例如：990~1000`);
          return;
        }

        let realMin = Math.min(startNum, endNum);
        let realMax = Math.max(startNum, endNum);

        if (realMin < minRoom || realMax > maxRoom) {
          alert(`輸入的範圍超出了目前模式的限制 (${minRoom} ~ ${maxRoom})`);
          return;
        }

        targetRoomId = random(realMin, realMax);
      } else {
        let cleanValue = rawValue.replace(/\D/g, '');
        targetRoomId = parseInt(cleanValue);

        if (isNaN(targetRoomId) || targetRoomId < minRoom || targetRoomId > maxRoom) {
          alert(`請輸入目前模式範圍內的正確房號數字 (${minRoom} ~ ${maxRoom})`);
          return;
        }
      }

      let percent = weightedPercent();
      openPopup(targetRoomId, percent);
      inputEl.value = ""; 
    }

    /* AI 彈窗核心：新增將數據百分比同步填入小視窗中的功能 */
    function openPopup(room, percent){
      popup.style.display = "flex";
      roomTitle.innerText = `第 ${room} 房`;
      
      // 將對應的 % 數值即時顯示在小視窗中央
      popupPercentText.innerText = `⚡ AI 分析爆分率：${percent}%`;

      let rank = "B";
      let text = "AI 判定普通｜建議觀察";

      if(percent >= 85){
        rank = "SS";
        text = "AI 判定超強勢｜建議重點主攻";
      } else if(percent >= 78){
        rank = "S";
        text = "AI 判定強勢｜推薦積極進場";
      } else if(percent >= 70){
        rank = "A";
        text = "AI 能量穩定｜可持續觀察";
      }

      rankText.innerText = `能量等級 ${rank}`;
      recommend.innerText = text;

      fill.style.width = "0%";
      setTimeout(() => {
        fill.style.width = percent + "%";
      }, 100);
    }

    function closePopup(){
      popup.style.display = "none";
      fill.style.width = "0%";
    }

    let currentOnlineCount = random(20, 40);
    document.getElementById("onlineCount").innerText = `${currentOnlineCount} 人`;

    setInterval(() => {
      let offset = random(-2, 2);
      currentOnlineCount += offset;
      if(currentOnlineCount < 15) currentOnlineCount = 20; 
      if(currentOnlineCount > 50) currentOnlineCount = 40; 
      document.getElementById("onlineCount").innerText = `${currentOnlineCount} 人`;

      let currentPower = parseFloat(document.getElementById("aiPower").innerText);
      let powerOffset = (Math.random() * 0.4 - 0.2).toFixed(1);
      let nextPower = (parseFloat(currentPower) + parseFloat(powerOffset)).toFixed(1);
      if(nextPower > 100) nextPower = 100;
      if(nextPower < 90) nextPower = 95;
      document.getElementById("aiPower").innerText = `${nextPower}%`;

      updateHourlyStrongestRoom();
    }, 2500);

    generateRooms();
    updateHourlyStrongestRoom();

    const server = document.getElementById("serverStatus");
    setTimeout(() => {
      server.innerHTML = `
        <div class="dot"></div>
        AI SERVER CONNECTED
      `;
    }, 3000);
  </script>
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch((error) => {
        console.warn("Service worker registration failed:", error);
      }));
    }
  </script>
</body>
